# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: risklens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m risklens.server --public
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
