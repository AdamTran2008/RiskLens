# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: risklens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m risklens.server --public
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set to "1" to let visitors analyze any ticker (downloads daily prices
      # from Yahoo Finance, rate-limited). Yahoo's data is meant for personal
      # use and Yahoo sometimes blocks cloud servers, so it is off by default.
      - key: RISKLENS_ALLOW_DOWNLOADS
        value: "0"
